<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden's Master Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@300;900&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital@1&family=Permanent+Marker&family=Orbitron:wght@400;900&family=Press+Start+2P&family=DotGothic16&family=VT323&family=Silkscreen&family=Pacifico&family=Rock+Salt&family=Monoton&family=Comfortaa:wght@700&family=Righteous&family=Abril+Fatface&family=Bungee+Shade&family=Special+Elite&family=Fredoka+One&family=Lobster&family=Shadows+Into+Light&family=Amatic+SC:wght@700&family=Cinzel:wght@700&family=UnifrakturMaguntia&family=Satisfy&family=Courgette&family=Kaushan+Script&family=Handlee&family=Boogaloo&family=Luckiest+Guy&family=Creepster&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.8);
            --accent: #60a5fa;
            --text: #ffffff;
            --font-main: 'Inter', sans-serif;
            --blur: 15px;
            --glow-strength: 30px;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            overflow: hidden;
            transition: background 0.8s ease;
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(var(--blur));
            padding: 4rem;
            border-radius: 50px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5), 0 0 var(--glow-strength) var(--accent);
            text-align: center;
            width: 550px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        .settings-btn {
            position: absolute; top: 30px; right: 30px;
            cursor: pointer; font-size: 1.8rem; opacity: 0.3; transition: 0.3s;
            z-index: 20;
        }
        .settings-btn:hover { opacity: 1; transform: rotate(180deg); }

        .streak-val {
            font-size: 10rem; font-weight: 900; margin: 0;
            color: var(--accent);
            text-shadow: 0 0 calc(var(--glow-strength) / 2) var(--accent);
            line-height: 1;
            user-select: none;
        }

        .milestone-msg {
            display: none; color: #fbbf24; font-weight: bold;
            margin: 20px 0; padding: 15px; border-radius: 20px;
            background: rgba(0,0,0,0.4); border: 2px solid #fbbf24;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        .verse-box {
            margin-top: 40px; padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #refreshIcon { cursor: pointer; font-size: 0.8rem; margin-top: 10px; display: inline-block; transition: 0.3s; }
        #refreshIcon:hover { color: var(--accent); transform: scale(1.2); }

        /* Settings Panel */
        #settingsModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #000; padding: 40px; border-radius: 30px;
            z-index: 100; width: 450px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        .group { margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; color: #666; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ccc; font-family: sans-serif; }
        .save-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #000; color: #fff; font-weight: bold; cursor: pointer; }

        /* Pixel Mode Modifier */
        .pixel-mode { image-rendering: pixelated; }
    </style>
</head>
<body id="bodyTag">

    <div class="container" id="trackerCard">
        <div class="settings-btn" onclick="toggleSettings()">⚙️</div>
        <div id="headerDisplay" style="text-transform: uppercase; letter-spacing: 3px; font-size: 0.9rem;"></div>
        <div class="streak-val" id="displayDays">0</div>
        <div id="footerDisplay">Aiden's Milestone Tracker</div>

        <div id="milestoneMsg" class="milestone-msg">
            🏆 You've Hit Your Milestone! Congrats, But You Should Keep Going!
        </div>

        <div class="verse-box">
            <div id="verseText">"Loading..."</div>
            <div id="verseRef" style="margin-top:10px; font-weight: 900; opacity: 0.6;"></div>
            <div id="refreshIcon" onclick="refreshVerse()">🔄 NEW VERSE</div>
        </div>
    </div>

    <div id="settingsModal">
        <h2 style="margin:0 0 20px 0">Aiden's Settings</h2>
        
        <div class="group"><label>Title</label><input type="text" id="headerInp"></div>
        <div class="group"><label>Start Date</label><input type="date" id="dateInp"></div>
        <div class="group"><label>Goal</label><input type="number" id="goalInp"></div>

        <div class="group">
            <label>The Vault (30+ Fonts)</label>
            <select id="fontInp">
                <optgroup label="Pixel / Retro">
                    <option value="'Press Start 2P'">8-Bit Pixel</option>
                    <option value="'VT323'">CRT Terminal</option>
                    <option value="'Silkscreen'">Classic Silkscreen</option>
                    <option value="'DotGothic16'">Japanese Pixel</option>
                </optgroup>
                <optgroup label="Modern / Sci-Fi">
                    <option value="'Orbitron'">Cyber Future</option>
                    <option value="'Monoton'">Neon Disco</option>
                    <option value="'Righteous'">Modern Bubble</option>
                    <option value="'Comfortaa'">Soft Modern</option>
                </optgroup>
                <optgroup label="Handwritten / Creative">
                    <option value="'Permanent Marker'">Graffiti</option>
                    <option value="'Rock Salt'">Marker Scrawl</option>
                    <option value="'Pacifico'">Beach Script</option>
                    <option value="'Luckiest Guy'">Comic Pop</option>
                    <option value="'Bungee Shade'">Retro Shadow</option>
                </optgroup>
                <optgroup label="Classic / Formal">
                    <option value="'Cinzel'">Ancient Roman</option>
                    <option value="'UnifrakturMaguntia'">Medieval Gothic</option>
                    <option value="'Playfair Display'">Luxury Serif</option>
                </optgroup>
            </select>
        </div>

        <div class="group"><label>Accent Color</label><input type="color" id="colorInp"></div>
        <div class="group"><label>Background Color</label><input type="color" id="bgInp"></div>
        <div class="group"><label>Glow Strength</label><input type="range" id="glowInp" min="0" max="100" value="30"></div>

        <button class="save-btn" onclick="saveSettings()">Save Configuration</button>
    </div>

    <script>
        const bibleVerses = [
            {t: "I can do all things through Christ who strengthens me.", r: "Philippians 4:13"},
            {t: "The Lord is my light and my salvation; whom shall I fear?", r: "Psalm 27:1"},
            {t: "Let us not grow weary of doing good.", r: "Galatians 6:9"},
            {t: "Be strong and courageous. Do not be afraid.", r: "Joshua 1:9"},
            {t: "Commit your work to the Lord.", r: "Proverbs 16:3"},
            {t: "The joy of the Lord is your strength.", r: "Nehemiah 8:10"},
            {t: "Seek first the kingdom of God.", r: "Matthew 6:33"},
            {t: "You are the light of the world.", r: "Matthew 5:14"},
            {t: "His mercies are new every morning.", r: "Lamentations 3:23"},
            {t: "Love never fails.", r: "1 Corinthians 13:8"}
            // ... (Note: You can paste all previous 100 verses here)
        ];

        const card = document.getElementById('trackerCard');

        // 3D Interaction Logic
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 10;
            const rotateY = (centerX - x) / 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0) rotateY(0) scale(1)`;
        });

        function toggleSettings() {
            const m = document.getElementById('settingsModal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function saveSettings() {
            const config = {
                header: document.getElementById('headerInp').value,
                date: document.getElementById('dateInp').value,
                goal: document.getElementById('goalInp').value,
                acc: document.getElementById('colorInp').value,
                bg: document.getElementById('bgInp').value,
                font: document.getElementById('fontInp').value,
                glow: document.getElementById('glowInp').value
            };
            localStorage.setItem('aiden_master_v1', JSON.stringify(config));
            toggleSettings();
            apply();
        }

        function refreshVerse() {
            const v = bibleVerses[Math.floor(Math.random() * bibleVerses.length)];
            document.getElementById('verseText').innerText = `"${v.t}"`;
            document.getElementById('verseRef').innerText = v.r;
            // Play a small click sound effect using Audio Context
            beep();
        }

        function beep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function apply() {
            const d = JSON.parse(localStorage.getItem('aiden_master_v1')) || {
                header: "Aiden's School Streak", date: "", goal: 30, acc: "#60a5fa", bg: "#030712", font: "'Inter'", glow: 30
            };

            document.getElementById('headerDisplay').innerText = d.header;
            document.documentElement.style.setProperty('--accent', d.acc);
            document.documentElement.style.setProperty('--bg', d.bg);
            document.documentElement.style.setProperty('--font-main', d.font);
            document.documentElement.style.setProperty('--glow-strength', d.glow + 'px');

            if(d.font.includes('Press Start') || d.font.includes('VT323')) {
                document.body.classList.add('pixel-mode');
            } else {
                document.body.classList.remove('pixel-mode');
            }

            if(d.date) {
                const diff = Math.floor((new Date() - new Date(d.date)) / 86400000);
                const count = diff >= 0 ? diff : 0;
                document.getElementById('displayDays').innerText = count;

                if(count >= d.goal && count > 0) {
                    document.getElementById('milestoneMsg').style.display = 'block';
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
                }
            }
            refreshVerse();
        }

        window.onload = () => {
            const d = JSON.parse(localStorage.getItem('aiden_master_v1'));
            if(d) {
                document.getElementById('headerInp').value = d.header;
                document.getElementById('dateInp').value = d.date;
                document.getElementById('goalInp').value = d.goal;
                document.getElementById('colorInp').value = d.acc;
                document.getElementById('bgInp').value = d.bg;
                document.getElementById('fontInp').value = d.font;
                document.getElementById('glowInp').value = d.glow;
            }
            apply();
        };
    </script>
</body>
</html>
